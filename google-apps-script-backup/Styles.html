<style>
/* Google Fonts Import */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

:root {
  --font-primary: 'Plus Jakarta Sans', sans-serif;
  --font-display: 'Outfit', sans-serif;
  
  /* Color Palette - Premium Teal & Slate */
  --primary: #0f766e; /* Teal 700 */
  --primary-hover: #0d9488; /* Teal 600 */
  --primary-light: #ccfbf1; /* Teal 100 */
  --primary-subtle: #f0fdfa; /* Teal 50 */
  
  --secondary: #0f172a; /* Slate 900 */
  --secondary-light: #475569; /* Slate 600 */
  
  --bg-app: #f8fafc; /* Slate 50 */
  --bg-card: rgba(255, 255, 255, 0.85);
  --border-color: rgba(226, 232, 240, 0.8);
  
  --success: #10b981; /* Green 500 */
  --success-bg: #ecfdf5;
  --warning: #f59e0b; /* Yellow 500 */
  --warning-bg: #fffbeb;
  --danger: #ef4444; /* Red 500 */
  --danger-bg: #fef2f2;
  --info: #3b82f6; /* Blue 500 */
  --info-bg: #eff6ff;
  
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 20px 40px -10px rgba(15, 23, 42, 0.12);
  
  --sidebar-width: 260px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-primary);
  background-color: var(--bg-app);
  color: var(--secondary);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* Scrollbar Style */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

/* Layout Grid */
.app-container {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
  width: var(--sidebar-width);
  background-color: var(--secondary);
  color: white;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 100;
  padding: 24px 16px;
  box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 28px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  margin-bottom: 24px;
}

.brand-icon {
  background: linear-gradient(135deg, var(--primary-hover), #2dd4bf);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-family: var(--font-display);
  font-size: 1.2rem;
  color: white;
  box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
}

.brand-name {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 1px;
  background: linear-gradient(to right, #ffffff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav-menu {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-grow: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  color: #94a3b8;
  text-decoration: none;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav-item:hover, .nav-item.active {
  color: white;
  background-color: rgba(255, 255, 255, 0.08);
}

.nav-item.active {
  background: linear-gradient(to right, var(--primary), rgba(15, 118, 110, 0.4));
  border-left: 4px solid var(--primary-hover);
}

.nav-icon {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

/* User Profile in Sidebar */
.user-widget {
  padding: 16px 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background-color: var(--primary-hover);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 0.9rem;
}

.user-details {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: white;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 140px;
}

.user-role {
  font-size: 0.75rem;
  color: #64748b;
  display: inline-block;
  background-color: #1e293b;
  padding: 2px 8px;
  border-radius: 20px;
  width: fit-content;
}

.role-switcher {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #94a3b8;
  padding: 6px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-family: var(--font-primary);
  width: 100%;
  outline: none;
  cursor: pointer;
  transition: all 0.2s;
}

.role-switcher:hover {
  border-color: var(--primary-hover);
  color: white;
}

/* Main Content Area */
.main-content {
  margin-left: var(--sidebar-width);
  width: calc(100% - var(--sidebar-width));
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Page Header */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.page-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.75rem;
  color: var(--secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.page-subtitle {
  font-size: 0.9rem;
  color: var(--secondary-light);
  margin-top: 4px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  font-family: var(--font-primary);
  font-weight: 600;
  font-size: 0.9rem;
  border-radius: var(--radius-md);
  border: none;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
}

.btn-primary {
  background-color: var(--primary);
  color: white;
  box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
}

.btn-primary:hover {
  background-color: var(--primary-hover);
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(15, 118, 110, 0.3);
}

.btn-secondary {
  background-color: white;
  border: 1px solid var(--border-color);
  color: var(--secondary-light);
}

.btn-secondary:hover {
  background-color: #f1f5f9;
  color: var(--secondary);
  border-color: #cbd5e1;
}

.btn-danger {
  background-color: var(--danger);
  color: white;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
}

.btn-danger:hover {
  background-color: #dc2626;
  transform: translateY(-1px);
}

.btn-info {
  background-color: #0284c7;
  color: white;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
}

.btn-info:hover {
  background-color: #0369a1;
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.8rem;
  border-radius: var(--radius-sm);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* Premium Card & Glassmorphism */
.card-premium {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  border-radius: var(--radius-lg);
  padding: 24px;
  transition: all 0.3s ease;
}

.card-premium:hover {
  box-shadow: var(--shadow-md);
  border-color: rgba(15, 118, 110, 0.15);
}

.card-header-flex {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}

.card-title {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--secondary);
}

/* Dashboard Grid */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.stats-card {
  display: flex;
  align-items: center;
  gap: 16px;
}

.stats-icon-wrapper {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
}

.stats-info {
  display: flex;
  flex-direction: column;
}

.stats-value {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--secondary);
  line-height: 1.2;
}

.stats-label {
  font-size: 0.8rem;
  color: var(--secondary-light);
}

/* Specific stats colors */
.stat-projects .stats-icon-wrapper { background-color: #eff6ff; color: #3b82f6; }
.stat-eq .stats-icon-wrapper { background-color: #f0fdfa; color: #0d9488; }
.stat-rules .stats-icon-wrapper { background-color: #faf5ff; color: #a855f7; }
.stat-investment .stats-icon-wrapper { background-color: #ecfdf5; color: #10b981; }

/* Dynamic Layouts & Tab Sections */
.tab-section {
  display: none;
}

.tab-section.active {
  display: flex;
  flex-direction: column;
  gap: 24px;
  animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Forms & Inputs */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.form-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.col-span-3 {
  grid-column: span 3;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.form-group.col-span-2 {
  grid-column: span 2;
}

.form-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--secondary-light);
  transition: all 0.25s ease;
}

.form-group:focus-within .form-label {
  color: var(--primary);
  transform: translateY(-1px);
}

.form-control {
  font-family: var(--font-primary);
  font-size: 0.9rem;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background-color: white;
  color: var(--secondary);
  outline: none;
  transition: all 0.2s;
  width: 100%;
  max-width: 100%;
}

.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
}

.form-control::placeholder {
  color: #94a3b8;
}

/* Table Style */
.table-wrapper {
  overflow-x: auto;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background-color: white;
}

.table-premium {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.88rem;
}

.table-premium th {
  background-color: #f8fafc;
  color: var(--secondary-light);
  font-weight: 600;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color);
  font-family: var(--font-display);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.table-premium td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-color);
  color: var(--secondary);
  vertical-align: middle;
}

.table-premium tbody tr:last-child td {
  border-bottom: none;
}

.table-premium tbody tr:hover {
  background-color: #f8fafc;
}

/* Status Badges */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}

.badge-success { background-color: var(--success-bg); color: var(--success); }
.badge-warning { background-color: var(--warning-bg); color: var(--warning); }
.badge-danger { background-color: var(--danger-bg); color: var(--danger); }
.badge-info { background-color: var(--info-bg); color: var(--info); }

/* Wizard Styles */
.wizard-steps {
  display: flex;
  justify-content: space-between;
  background: white;
  padding: 20px 40px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  margin-bottom: 8px;
}

.step-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--secondary-light);
  font-weight: 500;
  font-size: 0.9rem;
  position: relative;
}

.step-number {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 0.85rem;
  transition: all 0.3s;
}

.step-indicator.active {
  color: var(--primary);
  font-weight: 600;
}

.step-indicator.active .step-number {
  border-color: var(--primary);
  background-color: var(--primary);
  color: white;
  box-shadow: 0 0 0 4px var(--primary-light);
}

.step-indicator.completed {
  color: var(--success);
}

.step-indicator.completed .step-number {
  border-color: var(--success);
  background-color: var(--success);
  color: white;
}

/* Sizing Setup Blocks */
.sectors-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.sector-checkbox-card {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
  background-color: white;
  transition: all 0.2s;
}

.sector-checkbox-card:hover {
  border-color: var(--primary-hover);
  background-color: var(--primary-subtle);
}

.sector-checkbox-card.selected {
  border-color: var(--primary);
  background-color: var(--primary-subtle);
  box-shadow: 0 0 0 1px var(--primary);
}

.sector-checkbox-card input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  margin-top: 2px;
}

.sector-card-info {
  display: flex;
  flex-direction: column;
}

.sector-card-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--secondary);
}

.sector-card-desc {
  font-size: 0.75rem;
  color: var(--secondary-light);
  margin-top: 4px;
}

/* Dynamic Parameter Block */
.parameter-section-card {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px;
  background-color: white;
  margin-bottom: 16px;
}

.parameter-section-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 14px;
  border-bottom: 1px solid #f1f5f9;
  padding-bottom: 8px;
}

.parameter-inputs-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

/* Results Customization */
.qty-adjust-input {
  width: 60px;
  padding: 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  text-align: center;
  outline: none;
}

.qty-adjust-input:focus {
  border-color: var(--primary);
}

.adjust-log-info {
  font-size: 0.75rem;
  color: var(--secondary-light);
  display: block;
  margin-top: 4px;
  font-style: italic;
}

/* Layout for Audit and Admin Lists */
.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 1000;
}

.toast {
  background: white;
  border-left: 4px solid var(--primary);
  box-shadow: var(--shadow-lg);
  padding: 16px 20px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 300px;
  animation: slideIn 0.3s ease-out;
}

.toast-success { border-left-color: var(--success); }
.toast-danger { border-left-color: var(--danger); }
.toast-warning { border-left-color: var(--warning); }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(6px);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.22);
  width: 90%;
  max-width: 600px;
  max-height: 85vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 32px 28px 28px 28px;
  border: 1px solid rgba(15, 23, 42, 0.08);
  position: relative;
  transform: scale(0.95) translateY(12px);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
}

.modal-card.modal-lg {
  max-width: 980px;
  max-height: 95vh;
  padding: 24px 28px;
}

/* Color bar accent on top of the modal */
.modal-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--primary), #0d9488, #2dd4bf);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

.modal-overlay.active .modal-card {
  transform: scale(1) translateY(0);
  opacity: 1;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
}

.modal-title-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

.modal-title-icon-wrapper {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.modal-title-icon-wrapper.eq-icon {
  background-color: var(--primary-subtle);
  color: var(--primary);
  box-shadow: 0 2px 6px rgba(15, 118, 110, 0.12);
}

.modal-title-icon-wrapper.rule-icon {
  background-color: #eff6ff;
  color: #2563eb;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.12);
}

.modal-title-icon-wrapper.adjust-icon {
  background-color: #fdf2f8;
  color: #db2777;
  box-shadow: 0 2px 6px rgba(219, 39, 119, 0.12);
}

.modal-title-icon {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.modal-title {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--secondary);
}

.modal-close {
  background: rgba(15, 23, 42, 0.04);
  border: none;
  cursor: pointer;
  color: var(--secondary-light);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.modal-close:hover {
  background: rgba(239, 68, 68, 0.1);
  color: #ef4444;
  transform: rotate(90deg);
}

.modal-close svg {
  width: 18px;
  height: 18px;
}

.modal-footer {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  align-items: center;
}

/* Grid Layouts for Finance Resumo */
.finance-summary-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

.finance-breakdown-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.finance-breakdown-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background-color: white;
}

.finance-breakdown-label {
  font-weight: 600;
  font-size: 0.9rem;
}

.finance-breakdown-value {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--primary);
}
